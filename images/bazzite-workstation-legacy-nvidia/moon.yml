id: bazzite-workstation-legacy-nvidia
layer: application
stack: infrastructure
language: bash
tags:
  - bootc-image

dependsOn:
  - image-common

tasks:
  build:
    command: >-
      podman build --pull=newer
      --file images/bazzite-workstation-legacy-nvidia/Containerfile
      --tag bazzite-workstation-legacy-nvidia:latest .
    options:
      cache: false
      runFromWorkspaceRoot: true
    inputs:
      - "Containerfile"
      - "build.d/**/*"
      - "disk/**/*"
      - "/packages/image-common/**/*"

  lint:
    command: >-
      bash -c 'if compgen -G "build.d/*.sh" >/dev/null; then
      shellcheck build.d/*.sh; fi'
    inputs:
      - "build.d/*.sh"
